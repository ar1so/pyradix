[build-system]
requires = ["maturin>=1.14,<1.16"]
build-backend = "maturin"

[project]
name = "pyradix-radiomics"
version = "0.1.1"
description = "Fast, IBSI-compliant radiomics feature extraction for Python: a PyRadiomics 3.1.0-compatible alternative with a Rust engine"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "Ahmadreza Sohrabi-Ashlaghi" },
    { name = "Shahriar Kolahi" },
    { name = "Seyed Amir Asef Agah" },
    { name = "Mostafa Neshat Ghalibaf" },
]
keywords = [
    "radiomics",
    "pyradiomics",
    "pyradiomics-alternative",
    "ibsi",
    "image-biomarker",
    "radiomics-features",
    "texture-features",
    "texture-analysis",
    "glcm",
    "glrlm",
    "glszm",
    "gldm",
    "ngtdm",
    "feature-extraction",
    "medical-imaging",
    "quantitative-imaging",
    "ct",
    "mri",
    "pet",
    "nifti",
    "nrrd",
    "oncology",
    "rust",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "nibabel>=5.0",
    "pynrrd>=1.0",
    "pyyaml>=6.0",
]

[project.scripts]
pyradix = "pyradix.cli:main"

[project.urls]
Homepage = "https://github.com/ar1so/pyradix"
Repository = "https://github.com/ar1so/pyradix"
Documentation = "https://pyradix.readthedocs.io"
Changelog = "https://github.com/ar1so/pyradix/blob/main/CHANGELOG.md"
Issues = "https://github.com/ar1so/pyradix/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "maturin>=1.14,<1.16", "ruff>=0.6"]
test = ["pytest>=8.0", "simpleitk>=2.3"]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.26"]

[tool.ruff]
line-length = 100
src = ["python"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.maturin]
manifest-path = "crates/radix-py/Cargo.toml"
python-source = "python"
module-name = "pyradix._radix"
features = ["pyo3/extension-module"]
include = [
    "LICENSE",
    "CHANGELOG.md",
    "CITATION.cff",
    "CONTRIBUTING.md",
    "Cargo.lock",
    "rust-toolchain.toml",
    "examples/**/*",
    "docsite/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Local alternative to .github/workflows/ci.yml. Windows needs only MSVC.
# Published Linux wheels are built with maturin-action, not this host.
[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-*"
skip = "pp* *-musllinux_* *-win32 *-win_arm64"
test-requires = ["pytest>=8", "simpleitk>=2.3"]
test-command = "python -m pytest {project}/tests -q"
before-test = "python {project}/scripts/fetch_validation_data.py"

[tool.cibuildwheel.linux]
before-all = "yum install -y openblas-devel openblas-static gcc-gfortran pkgconfig || true"
