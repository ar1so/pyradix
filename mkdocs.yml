site_name: pyradix
site_description: >-
  Fast, IBSI-compliant radiomics feature extraction for Python. A PyRadiomics 3.1.0-compatible
  alternative with a Rust engine for CT, MRI and PET: shape, first-order, GLCM, GLRLM, GLSZM, GLDM and NGTDM features.
site_author: Ahmadreza Sohrabi-Ashlaghi, Shahriar Kolahi, Seyed Amir Asef Agah, Mostafa Neshat Ghalibaf
# Read the Docs sets the canonical URL (with /en/latest/); the fallback is for local builds.
site_url: !ENV [READTHEDOCS_CANONICAL_URL, "https://pyradix.readthedocs.io/en/latest/"]
repo_url: https://github.com/ar1so/pyradix
repo_name: ar1so/pyradix
edit_uri: edit/main/docsite/
docs_dir: docsite
site_dir: site-build
copyright: BSD 3-Clause licence · Ahmadreza Sohrabi-Ashlaghi, Shahriar Kolahi, Seyed Amir Asef Agah, Mostafa Neshat Ghalibaf

theme:
  name: material
  custom_dir: docsite-overrides
  logo: brand/radix-icon-reversed.svg
  favicon: brand/radix-icon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      toggle: {icon: material/weather-sunny, name: Light mode}
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight

extra_css:
  - brand/radix-theme.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [python]
          options:
            show_if_no_docstring: true
            docstring_style: google
            merge_init_into_class: true
            members_order: source

nav:
  - Home: index.md
  - Getting started:
      - Install: install.md
      - Usage: usage.md
  - User guide:
      - Parameters: parameters.md
      - Image filters: filters.md
      - IBSI or PyRadiomics?: modes.md
      - Mode differences: deviations.md
  - Feature reference:
      - Overview: features/index.md
      - First order: features/firstorder.md
      - Shape (3D): features/shape.md
      - Shape (2D): features/shape2d.md
      - GLCM: features/glcm.md
      - GLRLM: features/glrlm.md
      - GLSZM: features/glszm.md
      - GLDM: features/gldm.md
      - NGTDM: features/ngtdm.md
  - Validation: validation.md
  - FAQ: faq.md
  - Roadmap (GPU, planned): roadmap.md
  - API reference: api.md
  - About:
      - Citing: citing.md
      - Changelog: changelog.md
      - Contributing: contributing.md
